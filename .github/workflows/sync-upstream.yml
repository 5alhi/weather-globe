# Keeps this fork's main in step with vazyvazy123/weather-globe: once a day, or by hand from the Actions tab.
# If upstream changes a workflow file, this token may not merge it; use the "Sync fork" button on the repo page instead.
name: sync from upstream
on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == '5alhi/weather-globe'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main
